<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3A3846" />
    <title>車廂角落 Carriage Corner</title>
    <meta name="description" content="同在，但不必言語。一節永遠在行駛的北城捷運車廂。" />
    <!-- 閘門畫面的樣式直接內嵌：不等 JS 就能繪製（docs/PRD.md §6.5） -->
    <style>
      :root {
        --oat: #e8e1d5; --ink: #4a4744; --milk: #e6c9a8; --mist: #8fa3b5;
        --night: #3a3846; --lamp: #d9b98c; --rose: #b97a6f; --khaki: #a89170; --core: #7c93a8;
      }
      /* 刻意只有一套夜色調：遊戲本身就是一個固定的視覺世界 */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      /* HUD 避開瀏海與手勢列：畫面可以延伸到邊緣，按鈕與文字不行 */
      #hud { position: fixed; pointer-events: none;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      .gate { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
        padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
          max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        background: radial-gradient(120% 90% at 50% 0%, #4a4756 0%, var(--night) 70%); z-index: 10;
        transition: opacity .6s ease, visibility .6s; }
      .gate--leaving { opacity: 0; visibility: hidden; }
      /* 閘門卡片：米色紙票、像素階梯圓角（docs/PRD.md §16.2、第 21 章） */
      .gate__card { position: relative; width: min(440px, 100%); background: #f3ece1; padding: 18px 18px 16px; margin: auto;
        box-shadow: 0 0 0 3px #d8cab4, 0 0 0 6px #ebe2d4, 0 0 0 8px #c9b99f, 0 18px 40px rgba(0,0,0,.35);
        clip-path: polygon(0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
          100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
          6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)); }
      .gate__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
      .brand svg { width: 26px; height: 26px; image-rendering: pixelated; }
      .gate__tag { padding-left: 10px; border-left: 2px solid #cdbfa9; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--ink); }
      h1 { margin: 12px 0 0; font-size: 34px; font-weight: 800; letter-spacing: .32em; text-indent: .32em; text-align: center; }
      .sub { text-align: center; margin: 2px 0 14px; font-size: 12px; letter-spacing: .42em; text-indent: .42em; color: #6b6660; }
      /* 步驟條：①設定角色 ── ②選擇路線 */
      .stepper { list-style: none; display: flex; align-items: center; margin: 0 auto 14px; padding: 0; max-width: 340px; }
      .stepper__line { flex: 1; height: 3px; background: #cdbfa9; margin: 0 -2px; }
      .stepper__btn { display: inline-flex; align-items: center; gap: 8px; padding: 3px 14px 3px 3px; border-radius: 999px; border: 2px solid #d8cab4;
        background: #f6f1e8; color: #6b6660; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .12em; white-space: nowrap; }
      button.stepper__btn { cursor: pointer; }
      .stepper__num { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #cdbfa9; background: #f6f1e8;
        color: #8b857d; font-size: 15px; letter-spacing: 0; }
      .gate__card[data-step="1"] .stepper__item[data-n="1"] .stepper__btn,
      .gate__card[data-step="2"] .stepper__item[data-n="2"] .stepper__btn { background: #f6dcbc; border-color: #f6dcbc; color: var(--ink); }
      .gate__card[data-step="1"] .stepper__item[data-n="1"] .stepper__num,
      .gate__card[data-step="2"] .stepper__item[data-n="2"] .stepper__num { background: #c8946a; border-color: #b07c55; color: #fff7ec; }
      .gate__card[data-step="2"] .stepper__item[data-n="1"] .stepper__num { background: #e7d7c1; color: var(--ink); }
      .stepper__btn:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
      /* 角色預覽：一張撕線車票，左邊是名字與像素角色，右邊是天際線與列車 */
      .preview { position: relative; display: grid; grid-template-columns: 100px 1fr; min-height: 124px; margin: 0 0 14px; background: #f8f3ea;
        border: 2px solid #cdbfa9; border-radius: 4px; }
      .preview::before, .preview::after { content: ''; position: absolute; top: 50%; width: 14px; height: 22px; margin-top: -11px; background: #f3ece1; border: 2px solid #cdbfa9; }
      .preview::before { left: -2px; border-left: 0; border-radius: 0 11px 11px 0; }
      .preview::after { right: -2px; border-right: 0; border-radius: 11px 0 0 11px; }
      .preview__stub { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 6px 4px 6px 12px; border-right: 2px dashed #cdbfa9; }
      .preview__name { font-size: 15px; font-weight: 700; letter-spacing: .1em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .preview__name--empty { color: #a39c93; font-weight: 400; font-size: 13px; }
      .preview__sprite { width: 88px; height: 88px; image-rendering: pixelated; margin: -6px 0 -4px; }
      .preview__body { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 18px 6px 12px; min-width: 0; }
      .preview__tag { align-self: flex-end; padding: 2px 8px; border-radius: 999px; background: #e7dccb; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
      .preview__line { margin: 6px 0 4px; font-size: clamp(12px, 3.7vw, 15px); font-weight: 700; letter-spacing: .1em; white-space: nowrap; }
      .skyline { width: 100%; height: auto; image-rendering: pixelated; }
      .q { display: flex; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: .1em; margin: 14px 0 8px; color: var(--ink); }
      .q__hint { padding-left: 10px; border-left: 2px solid #cdbfa9; font-size: 12px; font-weight: 400; letter-spacing: .06em; color: #6b6660; }
      .opts { display: flex; flex-wrap: wrap; gap: 10px; }
      .opts--grid { display: grid; grid-template-columns: 1fr 1fr; }
      .opt { position: relative; appearance: none; border: 2px solid #d8cab4; background: #f6f1e8; color: var(--ink); border-radius: 4px;
        padding: 8px 12px; font: inherit; font-size: 16px; font-weight: 700; letter-spacing: .12em; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; }
      .opts--2 .opt { flex: 0 1 calc(50% - 5px); justify-content: center; }
      .opts--3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .opts--3 .opt { justify-content: center; gap: 6px; padding: 9px 4px; font-size: 14px; letter-spacing: .04em; white-space: nowrap; }
      .opt:hover { border-color: #c8b79c; }
      .opt[aria-pressed="true"] { border-color: var(--ink); background: #f6dcbc; box-shadow: 0 2px 0 var(--ink); }
      /* 選中的右上角打勾 */
      .opt[aria-pressed="true"]::after { content: '✓'; position: absolute; top: -10px; right: -10px; display: grid; place-items: center; width: 24px; height: 24px;
        border-radius: 50%; background: var(--ink); color: #fff7ec; font-size: 13px; font-weight: 800; letter-spacing: 0; box-shadow: 0 0 0 2px #f3ece1; }
      .opt .px { flex: none; width: 34px; height: 34px; image-rendering: pixelated; }
      .opt:focus-visible, .board:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
      /* 隨行卡：每張是一張小車票，上面印像素圖 */
      .card { flex-direction: column; gap: 6px; padding: 10px 10px 8px; font-size: 15px; }
      .card__art { position: relative; display: grid; place-items: center; width: 100%; height: 56px; background: #ece2d2; border: 2px solid #d8cab4; border-radius: 3px; overflow: hidden;
        background-image: linear-gradient(#ece2d2, #ece2d2), linear-gradient(90deg, transparent 0 8%, #ddd0bc 8% 16%, transparent 16% 22%, #ddd0bc 22% 27%, transparent 27% 66%, #ddd0bc 66% 74%, transparent 74% 80%, #ddd0bc 80% 90%, transparent 90%);
        background-size: 100% 60%, 100% 40%; background-position: top, bottom; background-repeat: no-repeat; }
      .card__art::before, .card__art::after { content: ''; position: absolute; top: 50%; width: 8px; height: 14px; margin-top: -7px; background: inherit; border: 2px solid #d8cab4; background: #f6f1e8; }
      .card[aria-pressed="true"] .card__art::before, .card[aria-pressed="true"] .card__art::after { background: #f6dcbc; }
      .card__art::before { left: -4px; border-radius: 0 7px 7px 0; }
      .card__art::after { right: -4px; border-radius: 7px 0 0 7px; }
      .card__art .px { position: relative; width: auto; height: 44px; }
      .card__art--tile { background: #f3e2c8; }
      .card__art--tile .px { width: 100%; height: 100%; }
      .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
      .board { margin-top: 18px; width: 100%; border: 2px solid #c99f73; border-radius: 4px; padding: 14px; font: inherit; font-size: 19px; font-weight: 800;
        letter-spacing: .18em; background: linear-gradient(#f3d2ad, #ecc093); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 #c99f73, inset 0 2px 0 #f9e3c9; }
      .board:active { transform: translateY(2px); box-shadow: 0 2px 0 #c99f73, inset 0 2px 0 #f9e3c9; }
      .board[disabled] { opacity: .6; cursor: progress; }
      .fine { text-align: center; font-size: 13px; color: #6b6660; margin: 14px 0 0; letter-spacing: .14em; }
      .legal { text-align: center; font-size: 10px; color: #8b857d; margin: 8px 0 0; line-height: 1.5; }
      .name { width: 100%; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .1em; color: var(--ink); background: #fbf8f2; border: 2px solid #d8cab4; border-radius: 4px; padding: 10px 14px; }
      .name::placeholder { color: #b5ada2; font-weight: 400; }
      .name:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; border-color: var(--ink); }
      .name-error { min-height: 1.2em; margin: 4px 0 0; font-size: 12px; color: var(--rose); }

      .step-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 2px; }
      .step-title { margin: 0; font-size: 20px; letter-spacing: .2em; }
      .back { appearance: none; border: 2px solid #d8cab4; background: #f6f1e8; color: var(--ink); border-radius: 4px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
      .back:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
      /* 進站路線圖：一條直的路線色帶，車站是可以點的站點 */
      .route { position: relative; list-style: none; margin: 0; padding: 4px 0 4px 0; max-height: min(46vh, 360px); overflow-y: auto; }
      .route::before { content: ''; position: absolute; left: 21px; top: 18px; bottom: 18px; width: 6px; background: var(--route, #7c93a8); border-radius: 3px; }
      .stop { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; appearance: none; border: 2px solid transparent; background: none;
        color: var(--ink); font: inherit; text-align: left; padding: 6px 8px 6px 12px; border-radius: 6px; cursor: pointer; }
      .stop:hover { background: #f6f1e8; }
      .stop[aria-pressed="true"] { background: #f6dcbc; border-color: var(--ink); }
      .stop:focus-visible { outline: 3px solid var(--rose); outline-offset: 1px; }
      .stop__dot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #fffaf1; border: 4px solid var(--route, #7c93a8); position: relative; z-index: 1; }
      .stop[aria-pressed="true"] .stop__dot { background: var(--route, #7c93a8); box-shadow: 0 0 0 3px #fffaf1, 0 0 0 5px var(--ink); }
      .stop__name { display: flex; flex-direction: column; line-height: 1.25; }
      .stop__zh { font-size: 15px; font-weight: 600; }
      .stop__en { font-size: 11px; color: #8b857d; }
      .stop__meta { margin-left: auto; display: flex; gap: 4px; align-items: center; font-size: 11px; color: #6b6660; white-space: nowrap; }
      .stop__xfer { padding: 1px 5px; border-radius: 3px; color: #fff; font-size: 10px; }
      /* 過場載入畫面：純 CSS 像素動畫，網頁一打開、JS 還沒載入前就看得到 */
      .loading { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; justify-items: center; gap: 14px;
        padding: 16px; background: #26242e; color: var(--oat); opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s; }
      .loading--on { opacity: 1; visibility: visible; }
      .loading__scene { position: relative; width: 256px; height: 88px; overflow: hidden; background: #2a2930;
        box-shadow: 0 0 0 4px #1e1d22; image-rendering: pixelated; }
      .loading__lights { position: absolute; left: 0; right: 0; top: 12px; height: 4px;
        background: repeating-linear-gradient(90deg, #f1e3cf 0 12px, transparent 12px 64px);
        animation: loading-lights .5s steps(4) infinite; }
      .loading__wall { position: absolute; left: 0; right: 0; top: 24px; height: 40px;
        background: repeating-linear-gradient(90deg, #333139 0 4px, #2a2930 4px 32px); animation: loading-lights 1s steps(8) infinite; }
      .loading__rail { position: absolute; left: 0; right: 0; bottom: 8px; height: 4px; background: #7d7b80;
        box-shadow: 0 6px 0 #4b4a50; }
      .loading__train { position: absolute; bottom: 16px; left: 0; width: 184px; height: 44px; background: var(--train, #7c93a8);
        animation: loading-train 1.8s steps(36) infinite; }
      .loading__train::before { content: ''; position: absolute; left: 12px; right: 20px; top: 8px; height: 16px;
        background: repeating-linear-gradient(90deg, #f1e3cf 0 20px, var(--train, #7c93a8) 20px 28px); }
      .loading__train::after { content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 4px; background: #e8e1d5; }
      .loading__nose { position: absolute; right: -8px; top: 4px; width: 8px; height: 36px; background: var(--train, #7c93a8); }
      .loading__title { margin: 4px 0 0; font-size: 16px; letter-spacing: .2em; text-wrap: balance; }
      .loading__dots::after { content: ''; animation: loading-dots 1.2s steps(4) infinite; }
      .loading__tip { margin: 0; max-width: 300px; min-height: 2.8em; text-align: center; font-size: 12px; line-height: 1.6; color: #a39c93; }
      @keyframes loading-lights { to { background-position-x: -64px; } }
      @keyframes loading-train { from { transform: translateX(-200px); } to { transform: translateX(272px); } }
      @keyframes loading-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
      @media (prefers-reduced-motion: reduce) {
        .loading__lights, .loading__wall, .loading__train, .loading__dots::after { animation: none; }
        .loading__train { transform: translateX(36px); }
      }
    </style>
  </head>
  <body>
    <div class="loading loading--on" id="loading" role="status" aria-live="polite">
      <div class="loading__scene" aria-hidden="true">
        <div class="loading__lights"></div>
        <div class="loading__wall"></div>
        <div class="loading__train"><span class="loading__nose"></span></div>
        <div class="loading__rail"></div>
      </div>
      <p class="loading__title"><span id="loading-title">列車準備中</span><span class="loading__dots"></span></p>
      <p class="loading__tip" id="loading-tip">TPRT 提示：車廂內禁止飲食，口渴的話到月台再喝吧。</p>
    </div>
    <div id="stage"></div>
    <div id="hud"></div>

    <main class="gate" id="gate">
      <section class="gate__card" data-step="1" aria-labelledby="gate-title">
        <header class="gate__top">
          <div class="brand">
          <!-- 北城捷運 TPRT 原創幾何 T 字像素標誌（docs/PRD.md §3.3） -->
          <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
            <rect width="16" height="16" fill="#e8e1d5" />
            <rect x="1" y="1" width="14" height="2" fill="#4a4744" />
            <rect x="6" y="3" width="4" height="10" fill="#4a4744" />
            <rect x="4" y="4" width="1" height="1" fill="#4a4744" /><rect x="11" y="4" width="1" height="1" fill="#4a4744" />
            <rect x="4" y="6" width="1" height="1" fill="#4a4744" /><rect x="11" y="6" width="1" height="1" fill="#4a4744" />
            <rect x="4" y="8" width="1" height="1" fill="#4a4744" /><rect x="11" y="8" width="1" height="1" fill="#4a4744" />
            <rect x="4" y="10" width="1" height="1" fill="#4a4744" /><rect x="11" y="10" width="1" height="1" fill="#4a4744" />
          </svg>
            北城捷運 TPRT
          </div>
          <span class="gate__tag">旅程準備</span>
        </header>
        <h1 id="gate-title">車廂角落</h1>
        <p class="sub">CARRIAGE CORNER</p>

        <!-- 步驟條：第 2 步時可以點第 1 步回去 -->
        <ol class="stepper" aria-label="進站步驟">
          <li class="stepper__item" data-n="1"><button class="stepper__btn" id="to-step-1" type="button"><span class="stepper__num">1</span>設定角色</button></li>
          <li class="stepper__line" aria-hidden="true"></li>
          <li class="stepper__item" data-n="2"><span class="stepper__btn"><span class="stepper__num">2</span>選擇路線</span></li>
        </ol>

        <!-- 第 1 步：設定角色 -->
        <div class="step" id="step-1">
          <div class="preview" role="img" aria-label="角色預覽">
            <div class="preview__stub">
              <span class="preview__name preview__name--empty" id="preview-name">你的名字</span>
              <canvas class="preview__sprite" id="preview-sprite" width="64" height="64"></canvas>
            </div>
            <div class="preview__body">
